# golangci-lint configuration. Encodes the CLAUDE.md house style where a linter
# can enforce it: short functions, low complexity, explicit errors, no stray
# fmt.Print* (structured slog only), gofumpt formatting.
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck      # never silently drop an error
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofumpt       # stricter gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - revive
    - gocritic
    - gocyclo       # one responsibility per function
    - funlen        # 4-20 line functions (CLAUDE.md)
    - nakedret
    - copyloopvar
    - forbidigo

linters-settings:
  funlen:
    lines: 30       # allows doc/blank lines around the ~20 logical lines
    statements: 20
  gocyclo:
    min-complexity: 12
  goimports:
    local-prefixes: github.com/Oblikovati/oblikovati
  revive:
    rules:
      - name: exported   # document every exported symbol
  forbidigo:
    forbid:
      - p: ^fmt\.Print.*$
        msg: "use log/slog for diagnostics; user-facing CLI text belongs in cmd/ output helpers"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Tests may be longer and print freely; test helpers carry general signatures
    # even when current call sites happen to pass a constant (unparam).
    - path: _test\.go
      linters: [funlen, gocyclo, forbidigo, dupl, unparam]
    # The recipe codecs (ADR-0020 document persistence) are exhaustive, one-case-per
    # -kind dispatch switches — serializing/restoring every entity/constraint/feature
    # kind — so their statement count is inherent to the dispatch, not a smell.
    - path: serialize.*\.go
      linters: [funlen, gocyclo]
    # The recipe DTOs deliberately echo their package (SketchData, FeatureData) for
    # readable cross-package use; the stutter is intentional, descriptive naming.
    - text: "stutters"
      linters: [revive]
    # Ribbon command tables and the router/feature-descriptor registries are exhaustive
    # one-entry-per-command/handler lists (same rationale as the serialize codecs): the
    # length is the list, not branching logic.
    - path: (app/commands_.*|addin/opregistry/registry|addin/router/router)\.go
      linters: [funlen]
    # The cylinder/drill files assemble a watertight B-rep body element-by-element (verts,
    # edges, faces, stitch); the statement count is the geometry being built, not branching
    # logic — same rationale as the serialize codecs.
    - path: kernel/brep/(cylinder|drill).*\.go
      linters: [funlen]
