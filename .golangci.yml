version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - forbidigo
    - funlen
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use log/slog for diagnostics; user-facing CLI text belongs in cmd/ output helpers
    funlen:
      lines: 30
      statements: 20
    gocyclo:
      min-complexity: 12
    revive:
      rules:
        - name: exported
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - forbidigo
          - funlen
          - gocyclo
          - unparam
        path: _test\.go
      - linters:
          - funlen
          - gocyclo
        path: serialize.*\.go
      - linters:
          - revive
        text: stutters
      - linters:
          - funlen
        path: (app/commands_.*|addin/opregistry/registry|addin/router/router)\.go
      - linters:
          - funlen
        path: kernel/brep/(cylinder|drill).*\.go
      # The Delaunay CDT's split/flip re-linking is straight-line adjacency code;
      # splitting it hurts readability, as with the geometry helpers above.
      - linters:
          - funlen
        path: kernel/meshbool/delaunay.*\.go
      # Disposable experiments print directly and keep exploratory helpers inline.
      - linters:
          - forbidigo
          - funlen
          - unparam
          - unused
        path: experiments/.*\.go
      # Geometry kernels, STEP parser/stringers, command dispatch, and sketch/feature
      # construction helpers are intentionally linear one-case-per-step algorithms.
      - linters:
          - funlen
          - gocyclo
        path: (addin/opregistry/feature_(advanced|solid)|app/loft_tool|cmd/oblikovati-cli/.*|kernel/exchange/step/part21/(parse_value|value|token)|kernel/ops/(convexhull|earcut)|model/feature/(dressup|loft_skin|sweep_loft|swept)|model/sketch/patterns|model/text/font)\.go
      # Thread designation parsing is a small grammar parser; branching reflects the grammar.
      - linters:
          - gocyclo
        path: model/feature/thread_spec\.go
      # go/parser.ParseDir is deprecated since Go 1.25 because it ignores build tags, but these
      # test-only architecture walkers parse untagged .go files under a single directory, where
      # that limitation does not apply. Surfaced when the linter moved to a Go 1.26 build.
      - linters:
          - staticcheck
        text: "SA1019: parser.ParseDir"
        path: _test\.go
      # material.Appearance / contract.Appearance are deliberately deprecated-but-kept
      # (M45, ADR-0053): the legacy metallic-roughness chain still works unmodified
      # alongside the new OpenPBRAppearance, so its own implementation and the code that
      # bridges it into the renderer (app/materials.go's appearanceSurface et al.) are
      # expected, permanent references to the deprecated type, not a to-be-fixed warning.
      - linters:
          - staticcheck
        text: "SA1019:.*Appearance is deprecated"
        path: (app/materials\.go|model/material/appearance\.go)
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - oblikovati
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
