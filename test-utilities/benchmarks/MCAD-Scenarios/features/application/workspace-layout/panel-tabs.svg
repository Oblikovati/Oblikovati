<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 370" role="img" aria-labelledby="title desc">
<title id="title">Panel tab switching in a drawing workspace</title>
<desc id="desc">Three original schematic states show the model browser, an active log panel and the restored model browser after closing the log tab.</desc>
<rect width="1050" height="370" fill="#edf2f7"/>
<defs><g id="workspace"><rect width="300" height="240" rx="5" fill="#29394e"/><rect x="98" y="12" width="190" height="215" fill="#faf8ed"/><path d="M108 23h170v194H108z" fill="none" stroke="#a4a6a0"/><rect x="7" y="12" width="84" height="215" fill="#40536c"/></g><g id="tree"><path d="M12 58h57M20 75h52M20 92h43M28 109h45" stroke="#cbd7e1" stroke-width="3" stroke-linecap="round"/></g><g id="modeltab"><rect x="8" y="17" width="49" height="23" rx="3" fill="#6b8fae"/><text x="15" y="33" font-size="11" fill="#fff">Model</text></g><g id="logtab"><rect x="58" y="17" width="30" height="23" rx="3" fill="#6b8fae"/><text x="63" y="33" font-size="10" fill="#fff">Log</text></g></defs>
<g font-family="sans-serif"><g transform="translate(24 48)"><use href="#workspace"/><use href="#modeltab"/><text x="67" y="33" font-size="16" fill="#d4e1eb">+</text><use href="#tree"/></g><g transform="translate(375 48)"><use href="#workspace"/><rect x="8" y="17" width="49" height="23" rx="3" fill="#33455b"/><text x="15" y="33" font-size="11" fill="#d5e2eb">Model</text><use href="#logtab"/><path d="M12 64h65M12 78h48" stroke="#8295a8" stroke-width="2"/></g><g transform="translate(726 48)"><use href="#workspace"/><use href="#modeltab"/><text x="67" y="33" font-size="16" fill="#d4e1eb">+</text><use href="#tree"/></g><g font-size="16" fill="#1a2c40"><text x="24" y="27">1. Model browser</text><text x="375" y="27">2. Log tab selected</text><text x="726" y="27">3. Log tab closed</text></g><g fill="none" stroke="#3d7299" stroke-width="3"><path d="M329 165h35m-9 -7 9 7-9 7"/><path d="M680 165h35m-9 -7 9 7-9 7"/></g><text x="24" y="331" font-size="14" fill="#40536c">The drawing remains visible while the dock displays the selected panel.</text></g></svg>