<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Document creation: schematic interaction states</title>
<desc id="desc">Original conceptual wireframes show the template chooser, the component selection prompt and the file browser. The layout is simplified and contains no source screenshots.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243248}.head{font-size:21px;font-weight:700}.label{font-size:15px}.small{font-size:13px}.muted{fill:#68788d}.surface{fill:#f7f9fc;stroke:#8798ad;stroke-width:2}.pane{fill:#fff;stroke:#b3c0cf}.select{fill:#d4eaff;stroke:#3984c5}.button{fill:#e8eef5;stroke:#8a9db1}.accent{fill:#327fc1}.line{stroke:#aab8c8;stroke-width:2}</style></defs>
<rect width="1200" height="690" fill="#e7ecf2"/>
<text x="28" y="36" class="head">Document creation — conceptual wireframes</text>
<text x="28" y="59" class="small muted">Original, simplified diagrams; names and available templates depend on configuration.</text>
<rect x="28" y="80" width="690" height="378" rx="7" class="surface"/><text x="45" y="107" class="head">1. Template chooser</text><path d="M45 120H700" class="line"/>
<rect x="45" y="136" width="150" height="262" rx="3" class="pane"/><text x="59" y="162" class="label">Folders</text><text x="59" y="190" class="small">▾ Templates</text><text x="74" y="215" class="small">▾ Locale</text><rect x="72" y="229" width="104" height="25" rx="3" class="select"/><text x="81" y="247" class="small">Metric</text><text x="81" y="276" class="small">English</text>
<rect x="207" y="136" width="287" height="262" rx="3" class="pane"/><text x="220" y="160" class="label">▾ Part</text><rect x="220" y="173" width="77" height="68" rx="4" class="select"/><path d="M241 194h28v23h-28z M248 188h28v23h-7" fill="none" stroke="#327fc1" stroke-width="3"/><text x="230" y="234" class="small">Part</text><rect x="308" y="173" width="77" height="68" rx="4" class="pane"/><path d="M329 218v-25h13v14h18" fill="none" stroke="#327fc1" stroke-width="4"/><text x="315" y="234" class="small">Sheet</text><text x="220" y="271" class="label">▾ Assembly</text><rect x="220" y="283" width="77" height="68" rx="4" class="pane"/><path d="M240 298h19v19h-19z M254 311h19v19h-19z" fill="none" stroke="#327fc1" stroke-width="3"/><text x="222" y="345" class="small">Assembly</text><text x="220" y="381" class="small muted">▾ Drawing · ▾ Presentation</text>
<rect x="506" y="136" width="194" height="262" rx="3" class="pane"/><text x="521" y="160" class="label">Selection details</text><path d="M522 178h160 M522 214h122 M522 249h140" class="line"/><rect x="530" y="275" width="146" height="95" rx="4" fill="#eef4fa"/><path d="M577 338l25-35 28 35z" fill="none" stroke="#54a06a" stroke-width="5"/><text x="520" y="388" class="small muted">Preview / layout choices</text><text x="48" y="432" class="small">Project</text><rect x="500" y="409" width="88" height="30" rx="4" class="select"/><text x="523" y="429" class="small">Create</text><rect x="600" y="409" width="88" height="30" rx="4" class="button"/><text x="622" y="429" class="small">Cancel</text>
<rect x="743" y="80" width="429" height="190" rx="7" class="surface"/><text x="760" y="107" class="head">2. Component selection</text><path d="M760 120H1154" class="line"/><text x="762" y="150" class="small">Document name</text><rect x="761" y="162" width="315" height="30" rx="3" class="pane"/><text x="772" y="182" class="small muted">Selected component path</text><rect x="1082" y="162" width="66" height="30" rx="3" class="button"/><text x="1090" y="182" class="small">Browse</text><rect x="966" y="213" width="82" height="30" rx="3" class="select"/><text x="994" y="233" class="small">OK</text><rect x="1062" y="213" width="86" height="30" rx="3" class="button"/><text x="1082" y="233" class="small">Cancel</text>
<rect x="743" y="289" width="429" height="335" rx="7" class="surface"/><text x="760" y="316" class="head">3. Component file browser</text><path d="M760 329H1154" class="line"/><rect x="760" y="344" width="95" height="188" class="pane"/><text x="772" y="369" class="small">Folders</text><path d="M773 386h65 M773 405h54 M773 424h62" class="line"/><rect x="866" y="344" width="170" height="188" class="pane"/><text x="878" y="369" class="small">Files</text><rect x="877" y="382" width="148" height="26" rx="3" class="select"/><text x="887" y="400" class="small">Selected part</text><path d="M880 427h132 M880 449h110 M880 471h126" class="line"/><rect x="1048" y="344" width="105" height="188" class="pane"/><text x="1061" y="369" class="small">Preview</text><rect x="760" y="548" width="393" height="26" rx="3" class="pane"/><text x="770" y="566" class="small muted">File name</text><rect x="970" y="585" width="85" height="27" rx="3" class="select"/><text x="994" y="603" class="small">Open</text><rect x="1066" y="585" width="87" height="27" rx="3" class="button"/><text x="1086" y="603" class="small">Cancel</text>
<text x="30" y="500" class="label">Blue highlight: current selection or primary action</text><text x="30" y="528" class="label">Muted control: unavailable until a template is selected</text><text x="30" y="556" class="label">Folder changes can retain an earlier template selection</text><text x="30" y="584" class="label">Browser Cancel returns to the component prompt</text><text x="30" y="650" class="small muted">Schematic only: it is not a pixel-accurate reproduction or a source screenshot.</text></svg>