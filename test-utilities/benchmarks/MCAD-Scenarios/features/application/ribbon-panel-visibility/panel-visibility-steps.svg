<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 630" role="img" aria-labelledby="title desc">
<title id="title">Ribbon panel visibility interaction sequence</title>
<desc id="desc">Original schematic illustrating a context menu, a checked panel entry, and the ribbon after hiding and restoring that panel. The layout is illustrative and is not a screenshot.</desc>
<rect width="980" height="630" fill="#edf2f6"/>
<g font-family="Segoe UI, sans-serif" fill="#203245"><text x="25" y="34" font-size="21" font-weight="600">Panel visibility: observed interaction flow</text><text x="25" y="58" font-size="14">Original schematic · labels identify roles, not product artwork</text></g>
<g font-family="Segoe UI, sans-serif" font-size="15" fill="#203245">
<text x="25" y="94" font-weight="600">1. Right-click a ribbon group</text><text x="510" y="94" font-weight="600">2. Open Show Panels and select a checked entry</text>
<text x="25" y="358" font-weight="600">3. Panel disappears; neighboring groups reflow</text><text x="510" y="358" font-weight="600">4. Select the unchecked entry to restore it</text></g>
<!-- panel 1 -->
<rect x="25" y="108" width="440" height="79" rx="4" fill="#26384d"/><g fill="#546e89"><rect x="37" y="121" width="125" height="51" rx="3"/><rect x="172" y="121" width="125" height="51" rx="3"/><rect x="307" y="121" width="125" height="51" rx="3"/></g><g font-family="sans-serif" font-size="14" fill="#f4f8fc"><text x="74" y="151">Create</text><text x="209" y="151">Modify</text><text x="346" y="151">Pattern</text></g>
<path d="M120 178 l13 23 -3 -13 12 -1 z" fill="#eef8ff" stroke="#25629a" stroke-width="2"/><rect x="130" y="189" width="210" height="126" fill="#fff" stroke="#91a0af"/><g font-family="sans-serif" font-size="14" fill="#26384d"><text x="145" y="215">Ribbon appearance</text><rect x="134" y="226" width="202" height="28" fill="#d7ecfb"/><text x="145" y="245">Show Panels</text><text x="315" y="245">›</text><text x="145" y="280">Docking options</text></g>
<!-- panel 2 -->
<rect x="510" y="108" width="440" height="79" rx="4" fill="#26384d"/><g fill="#546e89"><rect x="522" y="121" width="125" height="51" rx="3"/><rect x="657" y="121" width="125" height="51" rx="3"/><rect x="792" y="121" width="125" height="51" rx="3"/></g><g font-family="sans-serif" font-size="14" fill="#f4f8fc"><text x="560" y="151">Create</text><text x="694" y="151">Modify</text><text x="830" y="151">Pattern</text></g>
<rect x="540" y="189" width="175" height="126" fill="#fff" stroke="#91a0af"/><rect x="715" y="189" width="180" height="126" fill="#fff" stroke="#91a0af"/><rect x="718" y="228" width="174" height="28" fill="#d7ecfb"/><g font-family="sans-serif" font-size="14" fill="#26384d"><text x="551" y="245">Show Panels ›</text><text x="730" y="215">✓   Create</text><text x="730" y="247">✓   Modify</text><text x="730" y="279">✓   Pattern</text></g><text x="865" y="248" font-family="sans-serif" font-size="16" fill="#25629a">←</text>
<!-- panel 3 -->
<rect x="25" y="372" width="440" height="79" rx="4" fill="#26384d"/><g fill="#546e89"><rect x="37" y="385" width="125" height="51" rx="3"/><rect x="172" y="385" width="125" height="51" rx="3"/></g><g font-family="sans-serif" font-size="14" fill="#f4f8fc"><text x="74" y="415">Create</text><text x="210" y="415">Pattern</text></g><path d="M309 410 h75 m-14 -7 14 7 -14 7" fill="none" stroke="#4186b5" stroke-width="3"/><text x="37" y="484" font-family="sans-serif" font-size="14" fill="#203245">The hidden group is absent from the ribbon.</text>
<!-- panel 4 -->
<rect x="510" y="372" width="440" height="79" rx="4" fill="#26384d"/><g fill="#546e89"><rect x="522" y="385" width="125" height="51" rx="3"/><rect x="657" y="385" width="125" height="51" rx="3"/></g><g font-family="sans-serif" font-size="14" fill="#f4f8fc"><text x="560" y="415">Create</text><text x="695" y="415">Pattern</text></g><rect x="715" y="455" width="180" height="126" fill="#fff" stroke="#91a0af"/><rect x="718" y="494" width="174" height="28" fill="#d7ecfb"/><g font-family="sans-serif" font-size="14" fill="#26384d"><text x="730" y="481">✓   Create</text><text x="753" y="513">Modify</text><text x="730" y="545">✓   Pattern</text></g><text x="865" y="514" font-family="sans-serif" font-size="16" fill="#25629a">←</text>
<text x="25" y="605" font-family="sans-serif" font-size="13" fill="#536b81">Light menu · blue selection emphasis · dark ribbon · checkmark indicates a visible group</text>
</svg>