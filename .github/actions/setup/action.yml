name: Rust build tools
description: Install the pinned application toolchain and optional quality tools
inputs:
  quality:
    description: Install tools for the full local gate
    default: 'false'
runs:
  using: composite
  steps:
    - if: runner.os == 'Windows'
      shell: bash
      # Cargo's Git dependency checkout must admit the kernel's long evidence paths.
      run: git config --global core.longpaths true
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        # Native ABI fixtures compile against the pinned API's Go 1.27 contract.
        go-version: '1.27.0'
        cache: false
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
      with:
        toolchain: 1.99.0
        components: rustfmt, clippy, llvm-tools-preview
    - name: Keep cache cleanup within the build owner
      shell: bash
      run: |
        for setting in KACHE_AUTO_CLEAN_ORPHANED_TARGETS KACHE_AUTO_SHARE_TARGET_FILES KACHE_AUTO_RECOVER_TARGETS; do
          printf '%s=false\n' "$setting" >> "$GITHUB_ENV"
        done
        printf '%s\n' \
          'KACHE_AUTO_CLEAN_UNUSED_UNITS_DAYS=0' \
          'KACHE_AUTO_CLEAN_IDLE_TARGETS_DAYS=0' \
          'KACHE_GC_EVICT_SHARED=true' >> "$GITHUB_ENV"
    - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
      with:
        version: v2.0.0
        cache-executables: 'true'
        max-size: 4GiB
        cache-key-prefix: oblikovati-rust-kache-v2
        pr-comment: 'false'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      if: inputs.quality == 'true'
      with:
        node-version: 24.15.0
        cache: npm
    - if: inputs.quality == 'true'
      shell: bash
      run: |
        make tools
        echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libvulkan-dev pkg-config xvfb mesa-vulkan-drivers vulkan-validationlayers glslc
        printf '%s\n' 'XMODIFIERS=@im=none' >> "$GITHUB_ENV"
    - if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: |
        # The pinned lavapipe archive links LLVM 20 and libdisplay-info.so.1.
        sudo apt-get install -y libllvm20 libdisplay-info1
        cargo xtask native-validation "$RUNNER_TEMP/oblikovati-vulkan" "$GITHUB_ENV"
    - if: runner.os == 'macOS'
      shell: bash
      run: brew install glfw vulkan-loader vulkan-headers molten-vk pkg-config
