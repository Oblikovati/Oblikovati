name: Deploy Oblikovati Web

# Lightweight independent build-and-deploy pipeline for app.oblikovati.org.
# Runs on every merge into `rust` (or manual dispatch) without running test suites.

on:
  push:
    branches: [rust]
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/oblikovati/app.oblikovati.org
  WASM_BINDGEN_VERSION: "0.2.130"

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchains (stable for xtask + pinned nightly for wasm32 +atomics)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0

      - name: Install pinned wasm32 nightly toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' tools/build/wasm-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rust-src --target wasm32-unknown-unknown

      - name: Cache Cargo and wasm-bindgen build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: web-deploy-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/build/wasm-toolchain.toml') }}
          restore-keys: |
            web-deploy-${{ runner.os }}-

      - name: Install wasm-bindgen-cli
        shell: bash
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1 || [ "$(wasm-bindgen --version)" != "wasm-bindgen ${WASM_BINDGEN_VERSION}" ]; then
            cargo install wasm-bindgen-cli --locked --version "${WASM_BINDGEN_VERSION}"
          fi

      - name: Build Oblikovati Web WASM + WebGPU bundle
        shell: bash
        run: cargo xtask wasm-build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: app-oblikovati-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Open K3s API tunnel
        shell: bash
        env:
          KUBE_TUNNEL_SSH_KEY: ${{ secrets.KUBE_TUNNEL_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KUBE_TUNNEL_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '[100.89.0.119]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO2uONzdbVdL8rkEb1XNxil1OWuFZYJheESxuwEOfItw' > ~/.ssh/known_hosts
          ssh -fN -p 2222 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o ConnectTimeout=20 -L 16443:127.0.0.1:6443 tunnel@100.89.0.119

      - name: Deploy immutable image to app.oblikovati.org
        shell: bash
        env:
          KUBECONFIG_HETZNER: ${{ secrets.KUBECONFIG_HETZNER }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          printf '%s' "$KUBECONFIG_HETZNER" > kubeconfig
          export KUBECONFIG="$PWD/kubeconfig"
          sed "s|${IMAGE}:placeholder|${IMAGE_REF}|" deploy/web/kubernetes/production.yaml | kubectl apply -f -
          kubectl -n oblikovati rollout status deployment/app --timeout=180s
