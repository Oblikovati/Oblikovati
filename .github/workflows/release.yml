name: release

# Stable release: cut when a PR is merged into `release` (develop → release). Builds
# the GUI head + CLI for all platforms and publishes a GitHub release tagged
# v{MANUAL_MAJOR}.{API_VERSION}.{MINOR}.{PATCH} (computed by cmd/obkversion from
# version.yaml, the api pin, and git tags + commit scope; see RELEASING.md).
on:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # cmd/obkversion reads git tags + commit history for MINOR.PATCH
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Cache ON: every job used to recompile the whole module from scratch, which
          # cost far more than any duplicated test. Both go.sum files feed the key so a
          # head-module dependency change still invalidates it. Go's build cache is
          # content-addressed, so a stale entry cannot produce a wrong build.
          cache: true
          cache-dependency-path: |
            go.sum
            head/go.sum
      # Pin to the latest api release so API_VERSION matches what the build links.
      - uses: ./.github/actions/api-contract
      - id: v
        run: echo "version=$(go run ./cmd/obkversion stable)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    # macOS signing/notarization reads exactly these MACOS_* repo secrets — passed
    # explicitly (not inherit) so the reusable workflow sees nothing else.
    secrets:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_AC_APPLE_ID: ${{ secrets.MACOS_AC_APPLE_ID }}
      MACOS_AC_PASSWORD: ${{ secrets.MACOS_AC_PASSWORD }}
      MACOS_AC_TEAM_ID: ${{ secrets.MACOS_AC_TEAM_ID }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Assemble artifacts + checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          # Collect ONLY shippable artifacts. The macOS universal build also uploads
          # per-arch staging artifacts (head-macos-stage-*: the bare unsigned
          # oblikovati-head binary + bundled *.dylib) for the lipo step; those must
          # never land on the public release, so select by release filename shape
          # rather than copying every downloaded file.
          find artifacts -type f \( \
            -name '*.AppImage' -o \
            -name '*-macos-universal.zip' -o \
            -name '*-windows-amd64.zip' -o \
            -name 'oblikovati-cli-*' \
          \) -exec cp {} dist/ \;
          ( cd dist && files=$(ls) && sha256sum $files > checksums.txt )
          ls -la dist
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver='${{ needs.version.outputs.version }}'
          gh release create "v$ver" dist/* \
            --target "$GITHUB_SHA" --latest \
            --title "Oblikovati v$ver" \
            --generate-notes
