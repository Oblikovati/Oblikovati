name: nightly

# Nightly prereleases from develop. Runs every 6 hours and on demand; skips unless develop
# has new commits (merged PRs) since the last STABLE release. Publishes a single rolling
# `nightly` prerelease (tag moved each run).
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (00:00/06:00/12:00/18:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # Pin to the latest api release so API_VERSION matches what the build links.
      - uses: ./.github/actions/api-contract
      - id: check
        run: |
          set -euo pipefail
          echo "version=$(go run ./cmd/obkversion nightly)" >> "$GITHUB_OUTPUT"
          # Proceed only when develop has commits (merged PRs) since the last STABLE release.
          # The last release is the newest v* tag (release.yml tags v{...}); the rolling
          # `nightly` prerelease tag is excluded on purpose. With no v* tag yet there is
          # unreleased work, so we proceed (the first release has not been cut).
          last="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -n "$last" ]; then
            n="$(git rev-list --count "$last"..HEAD)"
          else
            n=1 # no stable release yet — proceed
          fi
          if [ "$n" -gt 0 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "No PRs merged on develop since the last release ($last) — skipping."
          fi

  build:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.guard.outputs.version }}
    # macOS signing/notarization reads exactly these MACOS_* repo secrets — passed
    # explicitly (not inherit) so the reusable workflow sees nothing else.
    secrets:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_AC_APPLE_ID: ${{ secrets.MACOS_AC_APPLE_ID }}
      MACOS_AC_PASSWORD: ${{ secrets.MACOS_AC_PASSWORD }}
      MACOS_AC_TEAM_ID: ${{ secrets.MACOS_AC_TEAM_ID }}

  publish:
    needs: [guard, build]
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Assemble artifacts + checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ( cd dist && files=$(ls) && sha256sum $files > checksums.txt )
          ls -la dist
      - name: Publish rolling nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver='${{ needs.guard.outputs.version }}'
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly dist/* \
            --prerelease --target develop \
            --title "Nightly $ver" \
            --notes "Automated nightly build from develop (\`$ver\`). Prerelease — not for production use."
