name: CI

on:
  push:
    branches: [develop, release]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # bash on every OS — Windows' default pwsh mangles `gotestsum -- -coverprofile=...`.
    shell: bash

jobs:
  # Keep the committed `oblikovati.org/api` pin tracking the latest published release.
  # The contract auto-releases a vX.Y.Z tag on every merge (Oblikovati.API), so a source
  # PR's pin drifts behind on its own; this bumps both modules to the newest release and
  # commits the result back onto the PR branch. The build/test jobs below build against
  # that same release regardless (via the api-contract action), so this only persists the
  # pin — it never gates the PR. Skipped for forks (no write access to the head branch).
  api-version:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - id: pin
        run: echo "version=$(scripts/sync-api-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Commit the pin if it changed
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- go.mod head/go.mod; then
            echo "oblikovati.org/api already pinned to $VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod head/go.mod
          git commit -m "build: pin oblikovati.org/api $VERSION"
          git push origin "HEAD:$BRANCH"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # Check out the latest api release and wire the build against it (ADR-0018).
      - uses: ./.github/actions/api-contract
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.13.1

  # Lint the architecture/design docs. Config: .markdownlint-cli2.jsonc at the root.
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8 # v16
        with:
          globs: |
            architecture/**/*.md

  # Check that cross-document links resolve (e.g. ADRs referencing each other).
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: "--offline --no-progress architecture"
          fail: true

  # SPDX: every Go file in this GPL repo must carry GPL-2.0-only.
  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/add-spdx-headers.py --check

  # Tier 1 — the fast unit tier (-short), Linux only, for a red inside a minute.
  # `make test-budget` also fails the job when a tier-1 package exceeds its time
  # budget, which is how a new corpus test that forgot its testing.Short() guard is
  # caught before it lands (architecture/testing/03-test-tiers-and-selection.md).
  # The `test` matrix below still runs the WHOLE suite on all three OSes, so nothing
  # is traded away here: this job only moves the first signal earlier.
  test-fast:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/api-contract
      - run: make test-budget

  # Tier 2 — the whole suite, corpus and oracle tests included, on every OS
  # (architecture/testing/README).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/api-contract
        # Wire the API replace into the translator modules too, not just the root: they are
        # separate modules whose COMMITTED `replace oblikovati.org/api => ../../../../../Oblikovati.API`
        # points at a sibling checkout that doesn't exist in CI (the contract lands in _api/). The
        # action rewrites each named module's replace to the _api path so their tests can build.
        with:
          modules: . model/exchange/translators/solidworks model/exchange/translators/inventor
      - run: go install gotest.tools/gotestsum
      # -timeout 60m overrides `go test`'s 10m PER-PACKAGE default, which was never a deliberate
      # policy — just the default nobody had hit yet. The OCCT blend-parity corpus (475 records,
      # model/feature/occtparity) and kernel/ops both run well past 10m on a CI runner once coverage
      # instrumentation is added, and `app` was already at 388s under race. A timed-out package
      # reports as a FAILURE indistinguishable from a real one, so this must stay generous.
      # -coverpkg credits a package's code to the tests that ACTUALLY exercise it, wherever they
      # live. Without it `go test` credits each test binary only to its own package, so the OCCT
      # blend-parity corpus (475 records in model/feature/occtparity — the primary exercise of the
      # fillet engine) credited kernel/ops NOTHING, and whole files read 0% while being driven hard
      # (fillet_elliptic_cone_runout.go: 181/181 "uncovered"). That understated coverage on new code
      # by ~13 points and failed SonarCloud's 80% gate on a measurement artefact, not a test gap.
      #
      # Scoped to the trees whose code is cross-exercised, NOT `./...`: instrumenting every
      # package into every test binary costs >30min on model/feature/occtparity alone, while this
      # scope measured 373s against 303s uninstrumented (+23%) for that package. `addin/...` is in
      # the list because the router/opregistry handlers are production code Sonar analyses (not
      # coverage-excluded), driven by addin/router/*_test.go here, yet — like the translator modules
      # below — read ~0% on new code unless instrumented, since a test binary otherwise credits only
      # its own package. Omitting it failed the 80% gate on a large handler tranche as a measurement
      # artefact, not a test gap. `renderer/...` (M45 ray-tracing backend: accumulator, BVH,
      # light/environment sampling, intersector) is the SAME failure mode: -coverpkg restricts
      # instrumentation to exactly the listed packages for every binary, so a package left out
      # gets none, even for its own tests — renderer read 0% on new code despite each file having
      # a same-named _test.go beside it, purely because it was missing from this list. `event/...`
      # (the pub/sub Bus, #2170's generic-methods conversion) hit the identical failure mode the
      # moment its new code grew past a handful of lines: 0% on new code despite `go test
      # ./event/...` itself reading 100% locally.
      #
      # Ubuntu-only because that is the single leg whose profile feeds the `sonar` job (see the
      # upload step below); the macOS/Windows legs keep the uninstrumented command so the slowest
      # matrix legs pay nothing for a profile that is then discarded.
      - name: Test
        run: |
          COVERPKG=""
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            COVERPKG="-coverpkg=./kernel/...,./model/...,./app/...,./addin/...,./renderer/...,./event/..."
          fi
          gotestsum --junitfile test-results-${{ matrix.os }}.xml -- \
            -coverprofile=coverage.out -covermode=count $COVERPKG -timeout 60m ./...
      # -coverpkg makes EVERY test binary emit a profile for EVERY instrumented package, so the
      # same block is repeated once per binary: measured 390 MB / 6.6M lines, far too large to
      # upload as an artifact and hand to the scanner. Collapsing duplicate blocks (summing their
      # counts, which is exactly `count` mode's semantics) yields 3.7 MB / 60k lines with
      # BIT-IDENTICAL results — verified per package (kernel/ops 92.4%, kernel/geom 91.9%,
      # model/feature 87.9%) and accepted by `go tool cover -func` (88.2% total).
      - name: Collapse duplicate coverage blocks
        if: matrix.os == 'ubuntu-latest'
        run: |
          awk 'NR==1 && /^mode:/ {print; next} {n[$1]=$2; c[$1]+=$3} END {for (k in n) print k, n[k], c[k]}' \
            coverage.out > coverage.merged && mv coverage.merged coverage.out
      # The SolidWorks/Inventor translators are separate go.work modules, so the root `./...`
      # above never runs their tests — leaving SonarCloud to see ~0% coverage on new code that
      # is in fact 74–85% covered. Run each nested module's tests (Linux, the leg that feeds
      # Sonar) and MERGE their `count` profiles into coverage.out: same `oblikovati.org/...`
      # paths Sonar already resolves for the root profile, so no path-mapping surprises.
      - name: Translator-module coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          for m in model/exchange/translators/solidworks model/exchange/translators/inventor; do
            (cd "$m" && go test -covermode=count -coverprofile=cover.out ./...)
            tail -n +2 "$m/cover.out" >> coverage.out
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results-${{ matrix.os }}.xml
      # One Go coverage profile (Linux) feeds the SonarCloud `sonar` job.
      - uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage-root
          path: coverage.out

  # Race detector needs cgo; Linux only.
  # Runs ONLY when cutting a release (develop → the `release` branch), never on a PR: `-race`
  # is by far the slowest gate on the board (minutes past the rest of the matrix) and was
  # stalling otherwise-green PR merges for no per-PR signal. Release is cut on push to `release`
  # (release.yml), so this is the pre-release race gate. develop has no branch protection, so a
  # PR that never runs `race` is not blocked on it.
  race:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/api-contract
      # The OCCT blend-parity corpus is excluded here, NOT because it is unverified under the race
      # detector but because instrumenting it on a CI runner buys no signal for hours of compute: it
      # is deterministic geometry whose only concurrency is t.Parallel() between independent test
      # functions. It is race-verified directly — `go test -race -parallel 16 ./model/feature/occtparity`
      # reports 0 data races (2071s on 32 cores). On a 2-4 core runner that parallel win collapses and
      # the same run costs multiple hours, so it would only ever time out. Re-run it locally when
      # touching the corpus harness; every other package still races here.
      - run: |
          go test -race -timeout 60m -skip 'TestNop.*CSG' \
            $(go list ./... | grep -v '/model/feature/occtparity$')

  # cgo GUI head (Vulkan + Dear ImGui). The PR test/race/build jobs above run `./...`
  # on the ROOT module only and with CGO_ENABLED=0, so the head module was previously
  # never compiled OR tested on a PR — its build could break and its end-to-end UI
  # in-window tests never ran (they `t.Skip` when no Vulkan/display is present). This
  # job closes that gap (REPORT.md §8 / DoD U-axis):
  #   1. builds the whole head module (catches cgo/binding breakage on every PR);
  #   2. runs head tests under a SOFTWARE Vulkan ICD (mesa lavapipe) + a virtual
  #      display (xvfb) so the in-window e2e tests actually execute instead of
  #      skipping. Tests still skip cleanly if lavapipe can't provide a device, so
  #      the job never goes flaky — but on a healthy runner the UI tests run for real.
  head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Match build.yml's head-linux toolchain.
          go-version: "1.27"
          cache: false
      - uses: ./.github/actions/api-contract
        with:
          modules: head
      - name: Install cgo + headless-Vulkan deps
        run: |
          sudo apt-get update
          # libglfw3-dev/libvulkan-dev/pkg-config: the cgo build (head/internal/native
          # uses `#cgo pkg-config: glfw3 vulkan`). mesa-vulkan-drivers: lavapipe software
          # ICD so a GPU-less runner still exposes a Vulkan 1.3 device. xvfb: a virtual
          # X display so GLFW window creation succeeds headlessly.
          sudo apt-get install -y libglfw3-dev libvulkan-dev pkg-config mesa-vulkan-drivers xvfb
      - name: Build head
        working-directory: head
        run: CGO_ENABLED=1 go build ./...
      - name: Test head (xvfb + lavapipe)
        working-directory: head
        run: xvfb-run -a go test -coverprofile=coverage.out -covermode=count ./...
      # The cgo head module's coverage profile for the SonarCloud `sonar` job.
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-head
          path: head/coverage.out

  # cgo GUI head — macOS compile check on EVERY PR (Apple Silicon + Intel). build.yml
  # only builds the macOS head in the release/nightly pipeline, and there it is gated on
  # the signing secrets, so darwin-only cgo / go.sum breakage used to reach develop
  # completely unvalidated (it surfaced only post-merge in nightly). Compiling the whole
  # head module on both Mac arches here makes a green PR guarantee the macOS build won't
  # break. Build-only: headless CI Macs have no window server for GLFW and no Metal
  # device for MoltenVK, so the in-window e2e tests stay on the ubuntu `head` job (xvfb +
  # lavapipe). The dep list mirrors build.yml's head-macos-build.
  head-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false
      - uses: ./.github/actions/api-contract
        with:
          modules: head
      - name: Install cgo + Vulkan deps
        run: brew install glfw vulkan-loader vulkan-headers molten-vk pkg-config
      - name: Build head
        working-directory: head
        run: CGO_ENABLED=1 go build ./...

  # cgo GUI head — Windows compile check on EVERY PR (mingw toolchain). Mirrors
  # build.yml's head-windows minus packaging, so mingw/cgo breakage is caught pre-merge
  # rather than in nightly. msys2 provides the Go + gcc + glfw/vulkan toolchain; the api
  # contract is resolved/checked out in bash then pinned in the msys2 shell (the same
  # split build.yml uses, because that job's Go lives inside msys2).
  head-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - id: api
        shell: bash
        run: echo "version=$(scripts/latest-api-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: Oblikovati/Oblikovati.API
          ref: ${{ steps.api.outputs.version }}
          path: _api
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-go
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-vulkan-headers
      - name: Pin + replace api to the release
        env:
          VERSION: ${{ steps.api.outputs.version }}
        run: |
          go -C head mod edit -require="oblikovati.org/api@$VERSION"
          go -C head mod edit -replace "oblikovati.org/api=$GITHUB_WORKSPACE/_api"
      - name: Build head
        working-directory: head
        run: CGO_ENABLED=1 go build ./...
      # The in-process .dll add-in loader (internal/addinhost, dl_windows.go:
      # LoadLibrary/GetProcAddress) is exercised ONLY on Windows — the ubuntu `head`
      # job covers the dlopen path and this job otherwise just compiles. Run the
      # loader/automation/reload/tree/gate suite so the Win32 trampoline stays at
      # parity on every PR (it builds real c-shared .dll fixtures via mingw gcc), and
      # emit a coverprofile so SonarCloud actually measures dl_windows.go's coverage.
      - name: Test head add-in loader (Windows .dll)
        working-directory: head
        run: CGO_ENABLED=1 go test -coverprofile=coverage-windows.out -covermode=count ./internal/addinhost/...
      # Windows-only .dll loader coverage (dl_windows.go) for the SonarCloud `sonar` job —
      # the ubuntu `head` job's Linux profile never contains dl_windows.go (build-tagged out).
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-head-windows
          path: head/coverage-windows.out

  # Confirm the cgo-free core cross-compiles for every shipping target.
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/api-contract
      - name: Cross-compile
        run: |
          GOOS=$(echo "${{ matrix.target }}" | cut -d/ -f1)
          GOARCH=$(echo "${{ matrix.target }}" | cut -d/ -f2)
          echo "building $GOOS/$GOARCH"
          GOOS=$GOOS GOARCH=$GOARCH go build ./...

  # Upload Go coverage to SonarCloud so it can measure coverage on new code (Automatic
  # Analysis cannot import Go coverage — sonar-project.properties has the one-time
  # setup). Reuses the coverage profiles produced by the `test` (root), `head` (Linux),
  # and `head-windows` (Windows .dll loader) jobs, so it adds no extra test runs. The
  # scan is SKIPPED until SONAR_TOKEN is set, so the job is green meanwhile.
  sonar:
    needs: [test, head, head-windows]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # SonarCloud needs full history for new-code detection / blame
      - uses: actions/download-artifact@v7
        with:
          name: coverage-root
          path: .
      - uses: actions/download-artifact@v7
        with:
          name: coverage-head
          path: head
      - uses: actions/download-artifact@v7
        with:
          name: coverage-head-windows
          path: head
      - name: SonarCloud scan (coverage upload)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Sonar not configured yet
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN not set — coverage profiles were generated but not uploaded. Add the SONAR_TOKEN secret and turn off Automatic Analysis in SonarCloud to enable CI coverage (see sonar-project.properties)."
