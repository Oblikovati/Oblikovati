name: Rust CI
on:
  push:
    branches: [rust, rust-work]
  pull_request:
    branches: [rust]
  workflow_call:
    inputs:
      revision:
        type: string
        default: ''
concurrency:
  # Package checks target an explicit revision and must retain their own run.
  group: rust-ci-${{ inputs.revision != '' && github.run_id || github.ref }}
  cancel-in-progress: ${{ inputs.revision == '' }}
permissions:
  contents: read
env:
  # Windows needs this before checkout to admit the benchmark evidence paths.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
  # Keep every check, but avoid retaining full type debug data on ephemeral runners.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
defaults:
  run:
    shell: bash
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          quality: 'true'
      - run: make gate-xvfb
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: rust-quality-reports
          path: target/quality/
          retention-days: 14
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: matrix
        run: echo "platforms=$(cargo xtask matrix)" >> "$GITHUB_OUTPUT"
  native:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build and test every discovered Cargo workspace
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            ./tools/with-xvfb.sh --window-manager cargo xtask native
          else
            cargo xtask native
          fi
