name: build

# Reusable build pipeline: cross-builds the cgo-free CLI and natively builds +
# packages the cgo/Vulkan GUI head per OS, uploading everything as run artifacts.
# Called by nightly.yml and release.yml.
#
# The Apache-2.0 API contract is a sibling repo (Oblikovati/Oblikovati.API). Each
# Go job checks it out into ./_api and points the `api` require at it via
# `go mod edit -replace` on the job's MAIN module (root for the CLI, head for the
# GUI) — the committed go.mod has no replace (local dev uses go.work).
on:
  workflow_call:
    inputs:
      version:
        description: "Full version, e.g. 0.0.20260602T120000[-nightly]"
        required: true
        type: string
    secrets:
      MACOS_CERT_P12_BASE64:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_AC_APPLE_ID:
        required: false
      MACOS_AC_PASSWORD:
        required: false
      MACOS_AC_TEAM_ID:
        required: false

env:
  # Stamp build.{Version,Commit,Date}; Commit/Date are filled per job.
  CORE: oblikovati

jobs:
  # CLI — pure Go, cross-compiled for every target in one job.
  cli:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Oblikovati/Oblikovati.API
          ref: develop
          path: _api
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod edit -replace oblikovati.org/api="$GITHUB_WORKSPACE/_api"
      - name: Cross-build CLI
        env:
          VER: ${{ inputs.version }} # via env, never interpolated into the script (script injection)
        run: |
          set -euo pipefail
          LD="-s -w -X ${CORE}/build.Version=${VER} -X ${CORE}/build.Commit=$(git rev-parse --short HEAD) -X ${CORE}/build.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${p%/*}; arch=${p#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            echo "→ cli $os/$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags "$LD" \
              -o "dist/oblikovati-cli-${VER}-${os}-${arch}${ext}" ./cmd/oblikovati-cli
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*

  # GUI head — Linux, packaged as an AppImage (Vulkan loader bundled, GPU ICD host-provided).
  head-linux:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Oblikovati/Oblikovati.API
          ref: develop
          path: _api
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: go -C head mod edit -replace oblikovati.org/api="$GITHUB_WORKSPACE/_api"
      - name: Install build + packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libvulkan-dev pkg-config imagemagick wget file
          wget -qO /usr/local/bin/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /usr/local/bin/linuxdeploy
      - name: Build head
        working-directory: head
        env:
          VER: ${{ inputs.version }} # via env, never interpolated into the script (script injection)
        run: |
          set -euo pipefail
          LD="-s -w -X ${CORE}/build.Version=${VER} -X ${CORE}/build.Commit=$(git rev-parse --short HEAD) -X ${CORE}/build.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=1 go build -ldflags "$LD" -o "$GITHUB_WORKSPACE/dist/oblikovati-head" ./cmd/oblikovati-head
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # GitHub runners have no FUSE
          VER: ${{ inputs.version }}
        run: scripts/package-linux.sh dist/oblikovati-head "$VER" dist
      - uses: actions/upload-artifact@v4
        with:
          name: head-linux
          path: dist/*.AppImage

  # GUI head — Windows, built with the MSYS2 mingw toolchain, zipped.
  head-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Oblikovati/Oblikovati.API
          ref: develop
          path: _api
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-go
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-vulkan-headers
            zip
      - run: go -C head mod edit -replace oblikovati.org/api="$GITHUB_WORKSPACE/_api"
      - name: Build head
        working-directory: head
        env:
          VER: ${{ inputs.version }} # via env, never interpolated into the script (script injection)
        run: |
          set -euo pipefail
          LD="-s -w -X ${CORE}/build.Version=${VER} -X ${CORE}/build.Commit=$(git rev-parse --short HEAD) -X ${CORE}/build.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=1 go build -ldflags "$LD" -o "$GITHUB_WORKSPACE/dist/oblikovati-head.exe" ./cmd/oblikovati-head
      - name: Package zip
        env:
          VER: ${{ inputs.version }} # via env, never interpolated into the script (script injection)
        run: |
          set -euo pipefail
          cd dist
          # Bundle the mingw runtime + GLFW DLLs the .exe needs (vulkan-1.dll ships
          # with the user's GPU driver). ldd lists the mingw deps.
          for dll in $(ldd oblikovati-head.exe | grep -i mingw64 | awk '{print $3}'); do cp "$dll" .; done
          cp /mingw64/bin/glfw3.dll . 2>/dev/null || true
          zip -j "oblikovati-head-${VER}-windows-amd64.zip" oblikovati-head.exe ./*.dll
      - uses: actions/upload-artifact@v4
        with:
          name: head-windows
          path: dist/*.zip

  # macOS signing is gated on repo secrets. A no-Gatekeeper-workaround download must be
  # Developer-ID signed + notarized, so without those credentials we skip the whole
  # macOS release rather than publish something Gatekeeper would block (forks and
  # unconfigured repos still build every other target). Secrets cannot be read in job
  # `if:` directly, so this job surfaces their presence as an output the macOS jobs gate
  # on. Requires the caller to pass `secrets: inherit`.
  macos-preflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          AC_APPLE_ID: ${{ secrets.MACOS_AC_APPLE_ID }}
          AC_PASSWORD: ${{ secrets.MACOS_AC_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.MACOS_AC_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PW" ] && [ -n "$AC_APPLE_ID" ] && [ -n "$AC_PASSWORD" ] && [ -n "$AC_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets not configured — skipping the macOS release."
          fi

  # GUI head — macOS per-arch build (Intel + Apple Silicon). Each runner natively builds
  # the cgo/Vulkan head and stages its binary plus the dylibs it bundles (loader, GLFW,
  # MoltenVK) for the universal merge in head-macos.
  head-macos-build:
    needs: macos-preflight
    if: needs.macos-preflight.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, arch: amd64 } # Intel
          - { runner: macos-14, arch: arm64 } # Apple Silicon
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Oblikovati/Oblikovati.API
          ref: develop
          path: _api
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: go -C head mod edit -replace oblikovati.org/api="$GITHUB_WORKSPACE/_api"
      - name: Install deps
        run: brew install glfw vulkan-loader vulkan-headers molten-vk pkg-config
      - name: Build head
        working-directory: head
        env:
          VER: ${{ inputs.version }} # via env, never interpolated into the script (script injection)
        run: |
          set -euo pipefail
          LD="-s -w -X ${CORE}/build.Version=${VER} -X ${CORE}/build.Commit=$(git rev-parse --short HEAD) -X ${CORE}/build.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=1 go build -ldflags "$LD" -o "$GITHUB_WORKSPACE/dist/oblikovati-head" ./cmd/oblikovati-head
      - name: Stage binary + dylibs
        run: scripts/macos-stage.sh dist/oblikovati-head "stage-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: head-macos-stage-${{ matrix.arch }}
          path: stage-${{ matrix.arch }}

  # GUI head — macOS universal bundle: lipo both arches into one Oblikovati.app, then
  # codesign (Developer ID + hardened runtime) + notarize + staple, so a downloaded build
  # runs on a clean Mac with no Vulkan SDK, no env setup, and no Gatekeeper prompt.
  head-macos:
    permissions:
      contents: read
    needs: [macos-preflight, head-macos-build]
    if: needs.macos-preflight.outputs.enabled == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: head-macos-stage-*
          path: stage
      - name: Lipo universal binary + dylibs
        run: |
          set -euo pipefail
          mkdir -p uni/bin uni/fw
          amd_bin="$(find stage -path '*amd64*' -name oblikovati-head -type f | head -1)"
          arm_bin="$(find stage -path '*arm64*' -name oblikovati-head -type f | head -1)"
          lipo -create "$amd_bin" "$arm_bin" -output uni/bin/oblikovati-head
          arm_fw="$(dirname "$(find stage -path '*arm64*' -name libvulkan.1.dylib -type f | head -1)")"
          amd_fw="$(dirname "$(find stage -path '*amd64*' -name libvulkan.1.dylib -type f | head -1)")"
          for f in "$arm_fw"/*.dylib; do
            b="$(basename "$f")"
            lipo -create "$amd_fw/$b" "$arm_fw/$b" -output "uni/fw/$b"
          done
      - name: Assemble .app
        env:
          VER: ${{ inputs.version }}
        run: scripts/package-macos.sh uni/bin/oblikovati-head uni/fw "$VER" dist
      - name: Import Developer ID certificate
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" -t cert -f pkcs12 -k "$KC" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENT="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          [ -n "$IDENT" ] || { echo "no Developer ID Application identity found in the imported certificate"; exit 1; }
          echo "DEVELOPER_ID_APP=$IDENT" >> "$GITHUB_ENV"
      - name: Sign, notarize, staple
        env:
          AC_APPLE_ID: ${{ secrets.MACOS_AC_APPLE_ID }}
          AC_PASSWORD: ${{ secrets.MACOS_AC_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.MACOS_AC_TEAM_ID }}
          VER: ${{ inputs.version }}
        run: scripts/macos-sign.sh dist/Oblikovati.app "$VER" dist
      - uses: actions/upload-artifact@v4
        with:
          name: head-macos
          path: dist/*.zip
