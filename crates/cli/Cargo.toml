[package]
name = "oblikovati-cli"
description = "Headless document tools for Oblikovati"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
oblikovati-martensite = { path = "../martensite" }
oblikovati-script = { path = "../script" }
oblikovati-automation = { path = "../automation" }
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "32ff38398ab6d6a7df0ca838654d5b8bc8d8b9cd", version = "=0.158.0" }
oblikovati-model = { path = "../model" }
oblikovati-session = { path = "../session" }
oblikovati-persistence = { path = "../persistence" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "=3.27.0"
