[package]
name = "oblikovati-cli"
description = "Headless document tools for Oblikovati"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "8a23d7aee54e018821ce942054649d8e5b8bdb68", version = "=0.157.0" }
oblikovati-model = { path = "../model" }
oblikovati-session = { path = "../session" }
oblikovati-persistence = { path = "../persistence" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "=3.27.0"
