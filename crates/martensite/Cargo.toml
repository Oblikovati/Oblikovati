# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-martensite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
martensite-tkg2d = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.3.7" }
martensite-tkgeomalgo = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.3.8" }
martensite-tkgeombase = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.3.6" }
martensite-tkernel = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.4.4" }
martensite-tkmath = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.3.8" }
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "f0943c724a6e07ec49533769c9e680137bb3d55c", version = "=0.159.0" }
oblikovati-solve = { path = "../solve" }
oblikovati-model = { path = "../model" }
martensite-tkhlr = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.3.6" }
martensite-tkmesh = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.3.8" }
martensite-tkg3d = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.3.9" }
martensite-tkprim = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.3.10" }
martensite-tkbrep = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.3.10" }
martensite-tktopalgo = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.4.3" }

martensite-tkbo = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.8.1" }

[lints]
workspace = true

[dev-dependencies]
oblikovati-persistence = { path = "../persistence" }
oblikovati-session = { path = "../session" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[test]]
name = "release_probe"
path = "tests/release_probe.rs"
