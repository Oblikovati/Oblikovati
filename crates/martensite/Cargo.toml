[package]
name = "oblikovati-martensite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
martensite-tkg2d = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.4.1" }
martensite-tkgeomalgo = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.4.1" }
martensite-tkgeombase = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.4.1" }
martensite-tkernel = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.5.1" }
martensite-tkmath = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.4.1" }
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "c8200b2da97c9a7dde43afb25debc977ff23b2fd", version = "=0.166.0" }
oblikovati-solve = { path = "../solve" }
oblikovati-model = { path = "../model" }
martensite-tkhlr = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.4.1" }
martensite-tkmesh = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.4.1" }
martensite-tkg3d = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.4.1" }
martensite-tkprim = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.4.1" }
martensite-tkbrep = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.4.1" }
martensite-tktopalgo = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.5.1" }
martensite-tkservice = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.5.2" }
martensite-tkv3d = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.8.1" }

martensite-tkbo = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.9.1" }
martensite-tkfillet = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.9.1" }
martensite-tkoffset = { git = "https://github.com/Oblikovati/Martensite", rev = "db01546bb032659682715c6120e628b95fe5773d", version = "=0.11.1" }

[lints]
workspace = true

[dev-dependencies]
oblikovati-session = { path = "../session" }
oblikovati-persistence = { path = "../persistence" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

