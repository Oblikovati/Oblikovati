# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-martensite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
oblikovati-model = { path = "../model" }
rustycad-tkmesh = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "193572dc3665598c4948777c87375bad7dc8114a", version = "=0.2.1" }
rustycad-tkg3d = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "193572dc3665598c4948777c87375bad7dc8114a", version = "=0.2.1" }
rustycad-tkprim = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "193572dc3665598c4948777c87375bad7dc8114a", version = "=0.2.1" }
rustycad-tkbrep = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "193572dc3665598c4948777c87375bad7dc8114a", version = "=0.2.1" }
rustycad-tkgeombase = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "193572dc3665598c4948777c87375bad7dc8114a", version = "=0.2.1" }
rustycad-tktopalgo = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "193572dc3665598c4948777c87375bad7dc8114a", version = "=0.2.1" }

rustycad-tkg2d = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "193572dc3665598c4948777c87375bad7dc8114a", version = "=0.2.1" }
rustycad-tkernel = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "193572dc3665598c4948777c87375bad7dc8114a", version = "=0.2.1" }
rustycad-tkmath = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "193572dc3665598c4948777c87375bad7dc8114a", version = "=0.2.1" }

[lints]
workspace = true

[dev-dependencies]
rustycad-tkbo = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "193572dc3665598c4948777c87375bad7dc8114a", version = "=0.2.1" }
oblikovati-session = { path = "../session" }
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "32ff38398ab6d6a7df0ca838654d5b8bc8d8b9cd", version = "=0.158.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[test]]
name = "release_probe"
path = "tests/release_probe.rs"
[[test]]
name = "planar_spline"
path = "tests/planar_spline.rs"
[[test]]
name = "go_spline_recipe"
path = "tests/go_spline_recipe.rs"
[[test]]
name = "prism"
path = "tests/prism.rs"
[[test]]
name = "sketch_prism"
path = "tests/sketch_prism.rs"

[[test]]
name = "profile_regions"
path = "tests/profile_regions.rs"
