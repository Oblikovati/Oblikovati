# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-martensite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "32ff38398ab6d6a7df0ca838654d5b8bc8d8b9cd", version = "=0.158.0" }
oblikovati-solve = { path = "../solve" }
martensite-tkgeomalgo = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.3.7" }
oblikovati-model = { path = "../model" }
martensite-tkmesh = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.3.6" }
martensite-tkg3d = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.3.6" }
martensite-tkprim = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.3.7" }
martensite-tkbrep = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.3.7" }
martensite-tkgeombase = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.3.5" }
martensite-tktopalgo = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.4.0" }

martensite-tkg2d = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.3.6" }
martensite-tkernel = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.4.1" }
martensite-tkmath = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.3.5" }

[lints]
workspace = true

[dev-dependencies]
oblikovati-persistence = { path = "../persistence" }
oblikovati-session = { path = "../session" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[test]]
name = "release_probe"
path = "tests/release_probe.rs"
[[test]]
name = "planar_spline"
path = "tests/planar_spline.rs"
[[test]]
name = "go_spline_recipe"
path = "tests/go_spline_recipe.rs"
[[test]]
name = "prism"
path = "tests/prism.rs"

[[test]]
name = "revolve"
path = "tests/revolve.rs"
[[test]]
name = "sketch_prism"
path = "tests/sketch_prism.rs"

[[test]]
name = "planar_intersections"
path = "tests/planar_intersections.rs"

[[test]]
name = "planar_curve_boundary"
path = "tests/planar_curve_boundary.rs"

[[test]]
