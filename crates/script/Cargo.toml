# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
[dependencies]
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "051956aa29a83643e84a955531633cabac352373", version = "=0.159.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
mlua = { version = "=0.12.2", features = ["lua51", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["process"] }
