<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="t d">
  <title id="t">Viewport Entity Selection</title>
  <desc id="d">Isometric 3D solid prism with its front-left face highlighted bright teal beneath a crisp selection pointer cursor.</desc>
  <g id="layer-body">
    <polygon points="13.8,6.3 22.4,10.6 13.8,14.9 5.2,10.6" class="f-icon-body-top s-icon-body-stroke" fill="#D2D7E2" stroke="#181B22" stroke-width="1.15" stroke-linejoin="round"/>
    <polygon points="5.2,10.6 13.8,14.9 13.8,24.7 5.2,20.4" class="f-icon-body-front s-icon-body-stroke" fill="#9EA6B8" stroke="#181B22" stroke-width="1.15" stroke-linejoin="round"/>
    <polygon points="22.4,10.6 13.8,14.9 13.8,24.7 22.4,20.4" class="f-icon-body-side s-icon-body-stroke" fill="#677084" stroke="#181B22" stroke-width="1.15" stroke-linejoin="round"/>
  </g>
  <g id="layer-accent">
    <polygon points="5.2,10.6 13.8,14.9 13.8,24.7 5.2,20.4" class="f-icon-sel-front s-icon-sel-stroke" fill="#14B8A6" stroke="#0B2926" stroke-width="1.15" stroke-linejoin="round"/>
    <polyline points="5.2,10.6 13.8,14.9 13.8,24.7" class="s-icon-sel-top" fill="none" stroke="#74EFE0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="layer-badge">
    <polygon points="18.6,17.6 18.6,26.8 21.1,24.4 23.2,28.2 25,27.3 22.9,23.5 26,23.3" class="f-icon-cutout s-icon-cutout" fill="#121317" stroke="#121317" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="18.6,17.6 18.6,26.8 21.1,24.4 23.2,28.2 25,27.3 22.9,23.5 26,23.3" fill="#FFFFFF" class="s-icon-body-stroke" stroke="#181B22" stroke-width="1.05" stroke-linejoin="round"/>
  </g>
</svg>
