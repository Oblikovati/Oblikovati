    <polygon points="12.6,21.5 16,23.2 16,26.8 12.6,25.1" fill="var(--icon-mod-front, #8172FA)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.0" stroke-linejoin="round"/>
