<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Fillet">
  <title>Fillet (32px 2.5D Isometric)</title>
  <!-- Layer 1: Neutral solid block -->
  <g id="layer-body">
    <polygon points="16,5 27,10.5 21,13.5 10,8" fill="var(--icon-body-top, #D2D7E2)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="5,15.5 16,21 16,27.5 5,22" fill="var(--icon-body-front, #9EA6B8)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M27,10.5 L27,22 L16,27.5 L16,21 C16,17.2 18.2,14.5 21,13.5 Z"
          fill="var(--icon-body-side, #677084)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <!-- Layer 2: Smoothly filleted Teal edge band (Selection / Edge Modify semantic) -->
  <g id="layer-accent">
    <path d="M10,8 L21,13.5 C18.2,14.5 16,17.2 16,21 L5,15.5 C5,11.7 7.2,9 10,8 Z"
          fill="var(--icon-sel-front, #14B8A6)" stroke="var(--icon-sel-stroke, #0B2926)" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Subtle top-left specular ridge line along fillet arc -->
    <path d="M8,10.8 L18.5,16" fill="none" stroke="var(--icon-sel-top, #74EFE0)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
