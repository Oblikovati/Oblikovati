<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="t d">
  <title id="t">Import CAD Geometry</title>
  <desc id="d">Import external STEP/IGES solid geometry with a left-side import badge.</desc>
  <g id="layer-body">
    <polygon points="17.5,7.5 26.5,12 17.5,16.5 8.5,12" fill="var(--icon-body-top, #D2D7E2)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.15" stroke-linejoin="round"/>
    <polygon points="8.5,12 17.5,16.5 17.5,26.5 8.5,22" fill="var(--icon-body-front, #9EA6B8)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.15" stroke-linejoin="round"/>
    <polygon points="26.5,12 17.5,16.5 17.5,26.5 26.5,22" fill="var(--icon-body-side, #677084)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.15" stroke-linejoin="round"/>
  </g>
  <g id="layer-accent">
    <polygon points="17.5,7.5 26.5,12 17.5,16.5 8.5,12" fill="var(--icon-mod-top, #B4AAFF)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.15" stroke-linejoin="round"/>
  </g>
  <g id="layer-badge">
    <circle cx="6.5" cy="16" r="5.6" fill="var(--icon-cutout, #121317)"/>
    <circle cx="6.5" cy="16" r="4.5" fill="var(--icon-mod-front, #8172FA)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="0.9"/><path d="M4.2,16 H8.3 M6.6,14.2 L8.5,16 L6.6,17.8" fill="none" stroke="#FFF" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
