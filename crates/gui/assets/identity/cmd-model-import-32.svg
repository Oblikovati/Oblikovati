    <polygon class="f-icon-body-front s-icon-body-stroke" points="8.5,12 17.5,16.5 17.5,26.5 8.5,22" fill="#9EA6B8" stroke="#181B22" stroke-width="1.15" stroke-linejoin="round"/>
