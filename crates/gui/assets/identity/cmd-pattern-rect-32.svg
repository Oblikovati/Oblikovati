<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Rectangular Pattern">
  <title>Rectangular Pattern — 3-Layer Anatomy + LR Badge Demo (32px)</title>
  <!-- Layer 1: Seed Neutral Solid Prism (Top-Left) -->
  <g id="layer-body">
    <polygon points="10,5 15,7.5 10,10 5,7.5" fill="var(--icon-body-top, #D2D7E2)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="5,7.5 10,10 10,15 5,12.5" fill="var(--icon-body-front, #9EA6B8)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="15,7.5 10,10 10,15 15,12.5" fill="var(--icon-body-side, #677084)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
  <!-- Layer 2: Patterned Indigo-Violet Instances -->
  <g id="layer-accent">
    <!-- Top-Right instance -->
    <polygon points="21,5 26,7.5 21,10 16,7.5" fill="var(--icon-mod-top, #B4AAFF)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="16,7.5 21,10 21,15 16,12.5" fill="var(--icon-mod-front, #8172FA)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="26,7.5 21,10 21,15 26,12.5" fill="var(--icon-mod-side, #5948D4)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- Bottom-Left instance -->
    <polygon points="10,16 15,18.5 10,21 5,18.5" fill="var(--icon-mod-top, #B4AAFF)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="5,18.5 10,21 10,26 5,23.5" fill="var(--icon-mod-front, #8172FA)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="15,18.5 10,21 10,26 15,23.5" fill="var(--icon-mod-side, #5948D4)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- Bottom-Right instance -->
    <polygon points="21,16 26,18.5 21,21 16,18.5" fill="var(--icon-mod-top, #B4AAFF)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="16,18.5 21,21 21,26 16,23.5" fill="var(--icon-mod-front, #8172FA)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="26,18.5 21,21 21,26 26,23.5" fill="var(--icon-mod-side, #5948D4)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
  <!-- Layer 3: Standardized LR Emerald Add (+) Badge with cutout halo -->
  <g id="layer-badge">
    <circle cx="25" cy="25" r="5.6" fill="var(--icon-cutout, #121317)"/>
    <circle cx="25" cy="25" r="4.6" fill="var(--status-success, #22C55E)" stroke="#0B2E18" stroke-width="0.9"/>
    <path d="M25,22.6 L25,27.4 M22.6,25 L27.4,25" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
