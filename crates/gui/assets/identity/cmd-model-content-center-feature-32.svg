<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="t d">
  <title id="t">Content Center Feature</title>
  <desc id="d">Standardized library solid block paired with a catalog table badge.</desc>
  <g id="layer-body">
    <defs><linearGradient id="ccC" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="var(--icon-body-front, #9EA6B8)"/><stop offset="28%" stop-color="var(--icon-body-top, #D2D7E2)"/><stop offset="68%" stop-color="var(--icon-body-front, #9EA6B8)"/><stop offset="100%" stop-color="var(--icon-body-side, #677084)"/></linearGradient></defs>
    <path d="M7.5,8.5 L7.5,22 A7.5,3.4 0 0,0 22.5,22 L22.5,8.5 Z" fill="url(#ccC)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.15" stroke-linejoin="round"/>
    <ellipse cx="15" cy="8.5" rx="7.5" ry="3.4" fill="var(--icon-body-top, #D2D7E2)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.15"/>
