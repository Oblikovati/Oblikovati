<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Work Plane">
  <title>Work Plane (32px 2.5D Isometric)</title>
  <!-- Layer 1: Neutral base reference plane -->
  <g id="layer-body">
    <polygon points="16,16 28,21.5 16,27 4,21.5"
             fill="var(--icon-body-front, #9EA6B8)" fill-opacity="0.32"
             stroke="var(--icon-line-general, #D2D7E2)" stroke-width="1.15" stroke-dasharray="2.5 1.5" stroke-linejoin="round"/>
  </g>
  <!-- Layer 2: Translucent Warm Amber offset Work Plane -->
  <g id="layer-accent">
    <line x1="16" y1="20.5" x2="16" y2="12.5" stroke="var(--icon-surf-front, #F59E0B)" stroke-width="1.4" stroke-linecap="round"/>
    <polygon points="16,6 28,11.5 16,17 4,11.5"
             fill="var(--icon-surf-front, #F59E0B)" fill-opacity="0.48"
             stroke="var(--icon-surf-top, #FDE08A)" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Subtle normal-direction corner tick -->
    <polyline points="14,10.5 16,9.5 18,10.5" fill="none" stroke="var(--icon-surf-top, #FDE08A)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
