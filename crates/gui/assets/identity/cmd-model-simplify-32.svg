  <g id="layer-body">
    <polygon points="9.5,9.6 14.3,12 9.5,14.4 4.7,12" fill="var(--icon-body-top, #D2D7E2)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.0" stroke-linejoin="round"/>
    <polygon points="4.7,12 9.5,14.4 9.5,19.4 4.7,17" fill="var(--icon-body-front, #9EA6B8)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.0" stroke-linejoin="round"/>
    <polygon points="14.3,12 9.5,14.4 9.5,19.4 14.3,17" fill="var(--icon-body-side, #677084)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.0" stroke-linejoin="round"/>
    <polygon points="9.5,17.1 14.3,19.5 9.5,21.9 4.7,19.5" fill="var(--icon-body-top, #D2D7E2)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.0" stroke-linejoin="round"/>
    <polygon points="4.7,19.5 9.5,21.9 9.5,26.9 4.7,24.5" fill="var(--icon-body-front, #9EA6B8)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.0" stroke-linejoin="round"/>
    <polygon points="14.3,19.5 9.5,21.9 9.5,26.9 14.3,24.5" fill="var(--icon-body-side, #677084)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.0" stroke-linejoin="round"/>
