    <polygon points="15.8,13.5 22,16.6 22,24.6 15.8,21.5" fill="var(--icon-mod-front, #8172FA)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.15" stroke-linejoin="round"/>
    <polygon points="28.2,13.5 22,16.6 22,24.6 28.2,21.5" fill="var(--icon-mod-side, #5948D4)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.15" stroke-linejoin="round"/>
    <path d="M13,16 L17,16 M14.78,17.36 L17,16 L14.78,14.64" fill="none" stroke="var(--icon-cutout, #121317)" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13,16 L17,16 M14.78,17.36 L17,16 L14.78,14.64" fill="none" stroke="var(--accent-selection-bright, #2DD4BF)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
