<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Start 2D Sketch">
  <title>Start 2D Sketch (32px Orthographic + 2D Profile)</title>
  <!-- Layer 1: Crisp 2D drafting profile & construction grid -->
  <g id="layer-body">
    <rect x="4.5" y="7.5" width="18" height="18" rx="1.5" fill="var(--accent-brand-subtle, rgba(129,114,250,0.14))" stroke="var(--icon-line-general, #D2D7E2)" stroke-width="1.5"/>
    <circle cx="13.5" cy="16.5" r="4" fill="none" stroke="var(--icon-line-center, #38BDF8)" stroke-width="1.25" stroke-dasharray="2.5 1.5"/>
    <!-- Sketch corner endpoints -->
    <circle cx="4.5" cy="7.5" r="1.8" fill="var(--accent-brand, #8172FA)"/>
    <circle cx="22.5" cy="25.5" r="1.8" fill="var(--accent-brand, #8172FA)"/>
    <circle cx="4.5" cy="25.5" r="1.8" fill="var(--icon-line-general, #D2D7E2)"/>
  </g>
  <!-- Layer 2: Precision Drafting Stylus -->
  <g id="layer-accent">
    <path d="M15.5,16.5 L25.2,6.8 L28.2,9.8 L18.5,19.5 L14.5,20.5 Z"
          fill="var(--icon-cutout, #121317)" stroke="var(--icon-cutout, #121317)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M15.5,16.5 L25.2,6.8 L28.2,9.8 L18.5,19.5 L14.5,20.5 Z"
          fill="var(--icon-mod-front, #8172FA)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="15.5,16.5 18.5,19.5 14.5,20.5" fill="var(--icon-surf-top, #FDE08A)"/>
    <line x1="23.2" y1="8.8" x2="26.2" y2="11.8" stroke="var(--icon-mod-top, #B4AAFF)" stroke-width="1.2"/>
  </g>
</svg>
