<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="t d">
  <title id="t">Insert iFeature</title>
  <desc id="d">Reusable Indigo-Violet feature inserted cleanly into a neutral host part.</desc>
  <g id="layer-body">
    <polygon points="16,11.4 25.5,16 16,20.6 6.5,16" fill="var(--icon-body-top, #D2D7E2)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="6.5,16 16,20.6 16,28.6 6.5,24" fill="var(--icon-body-front, #9EA6B8)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="25.5,16 16,20.6 16,28.6 25.5,24" fill="var(--icon-body-side, #677084)" stroke="var(--icon-body-stroke, #181B22)" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
  <g id="layer-accent">
    <polygon points="16,5.3 21.5,8 16,10.7 10.5,8" fill="var(--icon-mod-top, #B4AAFF)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="10.5,8 16,10.7 16,15.5 10.5,12.8" fill="var(--icon-mod-front, #8172FA)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="21.5,8 16,10.7 16,15.5 21.5,12.8" fill="var(--icon-mod-side, #5948D4)" stroke="var(--icon-mod-stroke, #1D1840)" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M16,3.2 L16,12.5 M14.54,10.11 L16,12.5 L17.46,10.11" fill="none" stroke="var(--icon-cutout, #121317)" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16,3.2 L16,12.5 M14.54,10.11 L16,12.5 L17.46,10.11" fill="none" stroke="var(--accent-selection-bright, #2DD4BF)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="layer-badge">
    <circle cx="25" cy="25" r="5.6" fill="var(--icon-cutout, #121317)"/>
    <circle cx="25" cy="25" r="4.5" fill="var(--status-success, #22C55E)" stroke="#0B2E18" stroke-width="0.9"/><path d="M25,22.7 L25,27.3 M22.7,25 L27.3,25" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
