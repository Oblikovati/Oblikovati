# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
[dependencies]
imgui = { version = "=0.12.0", features = ["docking", "tables-api"] }
oblikovati-viewport = { path = "../viewport" }
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "32ff38398ab6d6a7df0ca838654d5b8bc8d8b9cd", version = "=0.158.0" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "=1.1.5", features = ["event"] }
