# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-model"
description = "Document model and dependency rules for Oblikovati"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
oblikovati-solve = { path = "../solve" }
getrandom = "=0.4.3"
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "21b18a952fa7548a31e7eac338f6c78a32e5cfe1", version = "=0.159.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
uuid = { version = "=1.27.0", features = ["v5"] }
xml = "=1.4.0"

[[test]]
name = "sketch_revolve_recipe"
path = "tests/sketch_revolve_recipe.rs"
