# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-model"
description = "Document model and dependency rules for Oblikovati"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
maryada = "=0.2.0"
oblikovati-solve = { path = "../solve" }
getrandom = "=0.4.3"
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "3262b559d953b6327d4d2ba9123a2c4156df659c", version = "=0.159.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
uuid = { version = "=1.27.0", features = ["v5"] }
xml = "=1.4.0"

[[test]]
name = "sketch_revolve_recipe"
path = "tests/sketch_revolve_recipe.rs"

[dev-dependencies]
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
