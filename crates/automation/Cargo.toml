[package]
name = "oblikovati-automation"
description = "Typed automation dispatch over the owned Oblikovati session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
oblikovati-solve = { path = "../solve" }
oblikovati-persistence = { path = "../persistence" }
oblikovati-model = { path = "../model" }
oblikovati-martensite = { path = "../martensite" }
oblikovati-session = { path = "../session" }
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "57ae73ca46bfcadcc09e3ec1d0c424d803cadc44", version = "=0.159.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "=0.39.4", features = ["serialize"] }
