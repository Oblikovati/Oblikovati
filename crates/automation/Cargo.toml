# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-automation"
description = "Typed automation dispatch over the owned Oblikovati session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
oblikovati-solve = { path = "../solve" }
oblikovati-persistence = { path = "../persistence" }
oblikovati-model = { path = "../model" }
oblikovati-session = { path = "../session" }
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "32ff38398ab6d6a7df0ca838654d5b8bc8d8b9cd", version = "=0.158.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "=0.39.4", features = ["serialize"] }
martensite-tkgeomalgo = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.3.7" }
martensite-tkg2d = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.3.6" }
martensite-tkmath = { git = "https://github.com/Oblikovati/Martensite", rev = "6650a6d2548e5408a2bf6afc5cb76fa6fee29f86", version = "=0.3.5" }
