[package]
name = "oblikovati-automation"
description = "Typed automation dispatch over the owned Oblikovati session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
oblikovati-solve = { path = "../solve" }
oblikovati-persistence = { path = "../persistence" }
oblikovati-model = { path = "../model" }
oblikovati-martensite = { path = "../martensite" }
oblikovati-session = { path = "../session" }
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "609c679a880b991b165c2fbc6e2cc020d511cdd4", version = "=0.167.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "=0.39.4", features = ["serialize"] }
