# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-addin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
serde_json = "1"
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "f0943c724a6e07ec49533769c9e680137bb3d55c", version = "=0.159.0" }
[target.'cfg(target_os = "linux")'.dependencies]
oblikovati-automation = { path = "../automation" }
libc = "=0.2.190"
[dev-dependencies]
oblikovati-model = { path = "../model" }
oblikovati-session = { path = "../session" }
oblikovati-persistence = { path = "../persistence" }
serde = { version = "1", features = ["derive"] }
tempfile = "=3.27.0"
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
