# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-addin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "32ff38398ab6d6a7df0ca838654d5b8bc8d8b9cd", version = "=0.158.0" }
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
