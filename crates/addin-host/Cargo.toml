# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-addin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
serde_json = "1"
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "98425811b462c18ec573dfdcc33f2c7b264a6e25", version = "=0.161.0" }
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
oblikovati-automation = { path = "../automation" }
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_LibraryLoader"] }
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"
[dev-dependencies]
oblikovati-model = { path = "../model" }
oblikovati-session = { path = "../session" }
oblikovati-persistence = { path = "../persistence" }
serde = { version = "1", features = ["derive"] }
tempfile = "=3.27.0"
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
