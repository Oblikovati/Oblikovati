# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-viewport"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[package.metadata.oblikovati]
requires-display = true
[dependencies]
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "c8200b2da97c9a7dde43afb25debc977ff23b2fd", version = "=0.166.0" }
oblikovati-solve = { path = "../solve" }
oblikovati-model = { path = "../model" }
oblikovati-martensite = { path = "../martensite" }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
martensite-vulkan = { git = "https://github.com/Oblikovati/Martensite", rev = "d463526642b7bf950ba33c7ab4a4c9bc97caffaf", version = "=0.8.1" }
martensite-tkernel = { git = "https://github.com/Oblikovati/Martensite", rev = "d463526642b7bf950ba33c7ab4a4c9bc97caffaf", version = "=0.5.0" }
martensite-tkmath = { git = "https://github.com/Oblikovati/Martensite", rev = "d463526642b7bf950ba33c7ab4a4c9bc97caffaf", version = "=0.4.0" }
martensite-tkservice = { git = "https://github.com/Oblikovati/Martensite", rev = "d463526642b7bf950ba33c7ab4a4c9bc97caffaf", version = "=0.5.1" }
martensite-tkv3d = { git = "https://github.com/Oblikovati/Martensite", rev = "d463526642b7bf950ba33c7ab4a4c9bc97caffaf", version = "=0.8.0" }
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "=0.20.0", default-features = false, features = ["xkbcommon"] }
wayland-client = { version = "=0.31.14", features = ["system", "dlopen"] }
x11-dl = "=2.21.0"
x11rb = "=0.14.0"
libc = "=0.2.190"
rustix = { version = "=1.1.6", features = ["event", "fs", "pipe"] }

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[[test]]
name = "native"
path = "tests/native.rs"

[[test]]
name = "gui_render"
path = "tests/gui_render.rs"

[[test]]
name = "display_lifetime"
path = "tests/display_lifetime.rs"
