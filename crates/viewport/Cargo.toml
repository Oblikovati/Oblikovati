# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-viewport"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[package.metadata.oblikovati]
requires-display = true
[dependencies]
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "32ff38398ab6d6a7df0ca838654d5b8bc8d8b9cd", version = "=0.158.0" }
oblikovati-solve = { path = "../solve" }
oblikovati-model = { path = "../model" }
oblikovati-martensite = { path = "../martensite" }

[target.'cfg(target_os = "linux")'.dependencies]
martensite-vulkan = { git = "https://github.com/Oblikovati/Martensite", rev = "4141137449d911884c9a3fd261f7913498548e90", version = "=0.7.1" }
martensite-tkernel = { git = "https://github.com/Oblikovati/Martensite", rev = "4141137449d911884c9a3fd261f7913498548e90", version = "=0.4.2" }
martensite-tkmath = { git = "https://github.com/Oblikovati/Martensite", rev = "4141137449d911884c9a3fd261f7913498548e90", version = "=0.3.7" }
martensite-tkservice = { git = "https://github.com/Oblikovati/Martensite", rev = "4141137449d911884c9a3fd261f7913498548e90", version = "=0.4.1" }
martensite-tkv3d = { git = "https://github.com/Oblikovati/Martensite", rev = "4141137449d911884c9a3fd261f7913498548e90", version = "=0.7.0" }
x11-dl = "=2.21.0"
x11rb = "=0.14.0"
libc = "=0.2.190"
rustix = { version = "=1.1.5", features = ["event"] }

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[[test]]
name = "native"
path = "tests/native.rs"

[[test]]
name = "gui_render"
path = "tests/gui_render.rs"

[[test]]
name = "display_lifetime"
path = "tests/display_lifetime.rs"
