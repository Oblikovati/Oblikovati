# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-viewport"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[package.metadata.oblikovati]
requires-display = true
[dependencies]
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "21b18a952fa7548a31e7eac338f6c78a32e5cfe1", version = "=0.159.0" }
oblikovati-solve = { path = "../solve" }
oblikovati-model = { path = "../model" }
oblikovati-martensite = { path = "../martensite" }

[target.'cfg(target_os = "linux")'.dependencies]
martensite-vulkan = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.7.2" }
martensite-tkernel = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.4.4" }
martensite-tkmath = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.3.8" }
martensite-tkservice = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.4.1" }
martensite-tkv3d = { git = "https://github.com/Oblikovati/Martensite", rev = "d051ff699982faba4ec2df3ee9a47e14f38dedbd", version = "=0.7.1" }
x11-dl = "=2.21.0"
x11rb = "=0.14.0"
libc = "=0.2.190"
rustix = { version = "=1.1.5", features = ["event"] }

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[[test]]
name = "native"
path = "tests/native.rs"

[[test]]
name = "gui_render"
path = "tests/gui_render.rs"

[[test]]
name = "display_lifetime"
path = "tests/display_lifetime.rs"
