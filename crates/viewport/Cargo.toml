# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-viewport"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[package.metadata.oblikovati]
requires-display = true
[dependencies]
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "609c679a880b991b165c2fbc6e2cc020d511cdd4", version = "=0.167.0" }
oblikovati-solve = { path = "../solve" }
oblikovati-model = { path = "../model" }
oblikovati-martensite = { path = "../martensite" }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
martensite-vulkan = { git = "https://github.com/Oblikovati/Martensite", rev = "8422c9aeb9cbf89d3d286b53fa94da7b4172feef", version = "=0.9.0" }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_arch = "wasm32"))'.dependencies]
martensite-render-core = { git = "https://github.com/Oblikovati/Martensite", rev = "8422c9aeb9cbf89d3d286b53fa94da7b4172feef", version = "=0.1.0" }
martensite-webgpu = { git = "https://github.com/Oblikovati/Martensite", rev = "8422c9aeb9cbf89d3d286b53fa94da7b4172feef", version = "=0.1.1" }
martensite-tkernel = { git = "https://github.com/Oblikovati/Martensite", rev = "8422c9aeb9cbf89d3d286b53fa94da7b4172feef", version = "=0.5.2" }
martensite-tkmath = { git = "https://github.com/Oblikovati/Martensite", rev = "8422c9aeb9cbf89d3d286b53fa94da7b4172feef", version = "=0.4.2" }
martensite-tkservice = { git = "https://github.com/Oblikovati/Martensite", rev = "8422c9aeb9cbf89d3d286b53fa94da7b4172feef", version = "=0.6.0" }
martensite-tkv3d = { git = "https://github.com/Oblikovati/Martensite", rev = "8422c9aeb9cbf89d3d286b53fa94da7b4172feef", version = "=0.8.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.107", features = ["HtmlCanvasElement", "OffscreenCanvas"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "=0.20.0", default-features = false, features = ["xkbcommon"] }
wayland-client = { version = "=0.31.14", features = ["system", "dlopen"] }
x11-dl = "=2.21.0"
x11rb = "=0.14.0"
libc = "=0.2.190"
rustix = { version = "=1.1.6", features = ["event", "fs", "pipe"] }

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[[test]]
name = "native"
path = "tests/native.rs"

[[test]]
name = "gui_render"
path = "tests/gui_render.rs"

[[test]]
name = "display_lifetime"
path = "tests/display_lifetime.rs"
