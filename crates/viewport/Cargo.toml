# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "oblikovati-viewport"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[package.metadata.oblikovati]
requires-display = true
[dependencies]
oblikovati-solve = { path = "../solve" }
oblikovati-model = { path = "../model" }
oblikovati-martensite = { path = "../martensite" }

[target.'cfg(target_os = "linux")'.dependencies]
martensite-vulkan = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "d40ed71b704efd08310a4c56a1c1c3a64d4e3e9b", version = "=0.2.7" }
rustycad-tkernel = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "d40ed71b704efd08310a4c56a1c1c3a64d4e3e9b", version = "=0.2.7" }
rustycad-tkmath = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "d40ed71b704efd08310a4c56a1c1c3a64d4e3e9b", version = "=0.2.7" }
rustycad-tkservice = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "d40ed71b704efd08310a4c56a1c1c3a64d4e3e9b", version = "=0.2.7" }
rustycad-tkv3d = { git = "https://github.com/Oblikovati/RustyCADKernel", rev = "d40ed71b704efd08310a4c56a1c1c3a64d4e3e9b", version = "=0.2.7" }
x11-dl = "=2.21.0"
rustix = { version = "=1.1.4", features = ["event"] }
[dev-dependencies]
oblikovati-api = { git = "https://github.com/Oblikovati/Oblikovati.API.git", rev = "32ff38398ab6d6a7df0ca838654d5b8bc8d8b9cd", version = "=0.158.0" }

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[[test]]
name = "native"
path = "tests/native.rs"

[[test]]
name = "gui_render"
path = "tests/gui_render.rs"
