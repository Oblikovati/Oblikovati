# CI-based SonarCloud analysis. We use CI analysis (not Automatic Analysis) because only
# CI analysis can import Go test coverage — Automatic Analysis cannot, so it can never
# measure coverage on new code. The `sonar` job in .github/workflows/ci.yml runs the
# scanner and points it at the coverage profiles the test jobs produce.
#
# Configured (do not re-enable Automatic Analysis — the two are mutually exclusive):
#   - Automatic Analysis is OFF (SonarCloud -> Administration -> Analysis Method);
#   - the SONAR_TOKEN repository secret holds a project analysis token.
sonar.projectKey=Oblikovati_Oblikovati
sonar.organization=oblikovati

# Vendored Dear ImGui is upstream code we do not patch; `_api` is the sibling API repo
# checked out by CI, not our source.
sonar.exclusions=head/third_party/**,_api/**

# Go coverage profiles uploaded by the test (root module) and head (cgo module) jobs.
sonar.go.coverage.reportPaths=coverage.out,head/coverage.out

# Tests and fixtures are not production code that needs covering. The cgo binding layer
# (head/internal/native: C/C++ wrappers + their thin Go shims) carries no Go unit coverage by
# design — it is exercised through the head's in-window tests, which per-package Go coverage
# cannot credit to it — so it is excluded rather than counted as uncovered.
#
# The DWG paged-container decode (R2004/R2018 LZ77 + Reed-Solomon page/section maps) is
# exercised only by the real-file corpus integration tests (kernel/exchange/dwg), and those
# .dwg fixtures are 8–26 MB and git-ignored — they are not present in CI, so this code shows
# as uncovered there despite being tested locally. Same rationale as the native bindings.
#
# test-utilities holds offline fixture generators (the OCC/gmsh step-oracle script, blender
# projects) — tooling that produces committed test artifacts, not shipped code, so it is not
# unit-tested and must not count toward coverage.
#
# head/cmd/*shot are throwaway live-capture drivers (editorshot/m16shot/previewshot/
# sketchhudshot): tiny offscreen-render main programs used to screenshot a feature for visual
# review, not shipped product code — like test-utilities, they are dev tooling and must not
# count toward coverage.
#
# usagestats/sysinfo_{darwin,windows}.go are the macOS/Windows hardware probes (sysctl,
# Win32 GlobalMemoryStatusEx/GetDiskFreeSpaceEx). They ARE exercised by the cross-OS test
# matrix, but coverage is uploaded only from the ubuntu job, so they show as uncovered here
# despite being tested — same rationale as the native bindings and DWG decode above. The
# Linux probes (sysinfo_linux.go, sysinfo_unix.go) run on ubuntu and stay counted.
sonar.coverage.exclusions=**/*_test.go,**/testdata/**,test-utilities/**,head/internal/native/**,head/cmd/*shot/**,kernel/exchange/dwg/decompress.go,kernel/exchange/dwg/header_r2004.go,kernel/exchange/dwg/sectionmap.go,usagestats/sysinfo_darwin.go,usagestats/sysinfo_windows.go
