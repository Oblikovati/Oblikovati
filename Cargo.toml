# SPDX-License-Identifier: GPL-2.0-only
[workspace]
members = ["tools/build", "crates/model", "crates/persistence", "crates/session", "crates/cli", "crates/automation", "crates/solve", "crates/martensite", "crates/addin-host", "crates/script", "crates/viewport", "crates/head", "crates/gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-2.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
debug = "line-tables-only"
