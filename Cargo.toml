# SPDX-License-Identifier: GPL-2.0-only
[workspace]
members = ["tools/build", "crates/model", "crates/persistence", "crates/session", "crates/cli", "crates/automation", "crates/solve"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-2.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
debug = "line-tables-only"
